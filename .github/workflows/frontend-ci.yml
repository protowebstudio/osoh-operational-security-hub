name: frontend-ci

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Forbidden string scan
        run: npm run scan:forbidden

      - name: Assert local env
        run: npm run assert:env:local

      - name: Assert production env
        run: npm run assert:env:prod

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Write provenance
        shell: bash
        run: |
          mkdir -p dist
          cat > dist/build-provenance.json <<EOF
          {
            "commit_sha": "${GITHUB_SHA}",
            "ref_name": "${GITHUB_REF_NAME}",
            "workflow": "${GITHUB_WORKFLOW}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}"
          }
          EOF

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
